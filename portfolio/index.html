<!doctype html>
<html lang="es" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo-head-->
    <!--/seo-head-->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <noscript><style>#splash{display:none}</style></noscript>
    <meta name="theme-color" content="#ebeae4" />

    <!-- Pantalla de bienvenida: va inline para pintarse antes de que cargue el JS. -->
    <style>
      html.is-loading,
      html.is-loading body {
        overflow: hidden;
      }

      /* Texto de respaldo para buscadores y lectores sin JS: sigue en el DOM pero no ocupa espacio,
         así que cuando React lo reemplaza no hay salto de diseño. */
      #root > main:not(#main) {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: #ebeae4;
        color: #111315;
        transition: transform 0.75s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.75s ease, visibility 0s linear 0.75s;
      }

      #splash.hide {
        transform: translateY(-100%);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-inner {
        display: grid;
        justify-items: center;
        gap: 1.6rem;
        width: min(560px, 86vw);
        text-align: center;
      }

      .splash-kicker {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0;
        padding: 0.3rem 0.9rem;
        font-family: "Archivo Variable", "Archivo", "Segoe UI", system-ui, sans-serif;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: #111315;
        color: #ffd400;
        animation: splash-rise 0.6s cubic-bezier(0.23, 1, 0.32, 1) both;
      }

      .splash-kicker i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        animation: splash-blink 1.2s ease infinite;
      }

      .splash-hello {
        margin: 0;
        padding: 0.04em 0.06em 0.1em;
        overflow: hidden;
        font-family: "Archivo Variable", "Archivo", "Segoe UI", system-ui, sans-serif;
        font-weight: 900;
        font-variation-settings: "wdth" 62;
        font-stretch: 62%;
        text-transform: uppercase;
        font-size: clamp(3.4rem, 15vw, 7.5rem);
        line-height: 0.85;
        white-space: nowrap;
      }

      .splash-hello .l {
        display: inline-block;
        animation: splash-letter 0.9s cubic-bezier(0.23, 1, 0.32, 1) calc(0.25s + var(--i, 0) * 60ms) both;
      }

      .splash-hello .l:first-child {
        color: #00794f;
      }

      .splash-sub {
        margin: 0;
        font-family: "Archivo Variable", "Archivo", "Segoe UI", system-ui, sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        color: #484c50;
        animation: splash-rise 0.6s cubic-bezier(0.23, 1, 0.32, 1) 0.9s both;
      }

      /* ---- LOADER: un tren recorre cuatro estaciones ---- */
      .loader {
        position: relative;
        width: 100%;
        height: 6px;
        border-radius: 3px;
        background: rgba(17, 19, 21, 0.16);
        animation: splash-rise 0.6s cubic-bezier(0.23, 1, 0.32, 1) 0.5s both;
      }

      .loader .fill {
        position: absolute;
        inset: 0;
        border-radius: 3px;
        background: #00794f;
        transform-origin: left;
        animation: splash-fill 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      .loader b {
        position: absolute;
        top: 50%;
        width: 16px;
        height: 16px;
        margin: -8px 0 0 -8px;
        border-radius: 50%;
        background: #ebeae4;
        border: 3px solid #111315;
      }

      .loader b:nth-of-type(1) { left: 0; }
      .loader b:nth-of-type(2) { left: 33.33%; }
      .loader b:nth-of-type(3) { left: 66.66%; }
      .loader b:nth-of-type(4) { left: 100%; }

      .loader .train {
        position: absolute;
        top: 50%;
        left: 0;
        width: 16px;
        height: 28px;
        margin: -14px 0 0 -8px;
        border-radius: 6px;
        background: #ffd400;
        border: 3px solid #111315;
        animation: splash-ride 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes splash-letter {
        from {
          transform: translateY(110%) rotate(6deg);
        }
      }

      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }

      @keyframes splash-blink {
        50% {
          opacity: 0.25;
        }
      }

      @keyframes splash-fill {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }

      @keyframes splash-ride {
        from {
          left: 0;
        }
        to {
          left: 100%;
        }
      }

      /* Salida: la cortina sube y deja ver el hero armándose. */
      #splash::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -14px;
        height: 14px;
        background: #ffd400;
        border-top: 3px solid #111315;
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-kicker,
        .splash-kicker i,
        .splash-hello .l,
        .splash-sub,
        .loader,
        .loader .fill,
        .loader .train {
          animation: none;
        }
        .loader .fill {
          transform: scaleX(0.5);
        }
        .loader .train {
          left: 50%;
        }
        #splash,
        #splash.hide {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div class="splash-inner">
        <p class="splash-kicker"><i aria-hidden="true"></i>HGS · Medellín</p>
        <p class="splash-hello" id="splash-hello">Bienvenido</p>
        <div class="loader" aria-hidden="true"><span class="fill"></span><b></b><b></b><b></b><b></b><i class="train"></i></div>
        <p class="splash-sub" id="splash-sub">Cargando…</p>
      </div>
    </div>
    <script src="/splash.js"></script>
    <div id="root">
      <!--seo-body-->
      <!--/seo-body-->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
