<!doctype html>
<html lang="es" class="is-ready mz-loading" data-on="startup">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo-head-->
    <!--/seo-head-->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/migozz-icon.webp" />
    <meta name="theme-color" content="#ffffff" />
    <noscript><style>#mz-splash{display:none}</style></noscript>

    <!-- Pantalla de carga: va inline para pintarse antes que el JS y el CSS. La quita MigozzPage al montar. -->
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
      }

      html.mz-loading,
      html.mz-loading body {
        overflow: hidden;
      }

      /* Texto de respaldo para buscadores y lectores sin JS: sigue en el DOM, pero no se ve sin estilos. */
      #root > main:not(#main) {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      #mz-splash {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: grid;
        place-items: center;
        background:
          radial-gradient(32rem 26rem at 50% 45%, rgba(142, 45, 226, 0.14), transparent 70%),
          #ffffff;
        transition:
          opacity 0.5s ease,
          visibility 0s linear 0.5s;
        /* Red de seguridad: si el JS falla, la pantalla se va sola. */
        animation: mz-splash-out 0.5s ease 8s forwards;
      }

      #mz-splash.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .mz-splash-logo {
        position: relative;
        width: 112px;
        height: 112px;
      }

      .mz-splash-logo img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 26%;
        box-shadow: 0 20px 50px rgba(142, 45, 226, 0.3);
        animation: mz-splash-beat 1.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }

      .mz-splash-logo::before,
      .mz-splash-logo::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 26%;
        border: 2px solid #8e2de2;
        animation: mz-splash-ring 1.6s ease-out infinite;
      }

      .mz-splash-logo::after {
        animation-delay: 0.8s;
      }

      .mz-splash-bar {
        position: absolute;
        bottom: -38px;
        left: 50%;
        width: 120px;
        height: 4px;
        margin-left: -60px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(88, 28, 160, 0.12);
      }

      .mz-splash-bar::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: 2px;
        background: linear-gradient(90deg, #6d1fc0, #8e2de2, #d43fc6);
        animation: mz-splash-slide 1.1s ease-in-out infinite;
      }

      @keyframes mz-splash-beat {
        50% {
          transform: scale(0.92);
        }
      }

      @keyframes mz-splash-ring {
        from {
          transform: scale(1);
          opacity: 0.8;
        }
        to {
          transform: scale(1.7);
          opacity: 0;
        }
      }

      @keyframes mz-splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(230%);
        }
      }

      @keyframes mz-splash-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mz-splash-logo img,
        .mz-splash-logo::before,
        .mz-splash-logo::after,
        .mz-splash-bar::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="mz-splash" role="status" aria-label="MIGOZZ">
      <div class="mz-splash-logo">
        <img src="/migozz-icon.webp" alt="" width="112" height="112" />
        <span class="mz-splash-bar" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root">
      <!--seo-body-->
      <!--/seo-body-->
    </div>
    <script type="module" src="/src/migozz.tsx"></script>
  </body>
</html>
