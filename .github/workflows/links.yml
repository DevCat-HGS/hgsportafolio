name: Links

# Checks every URL written in the site content and the READMEs, weekly and on demand. When one stops responding it
# opens a single "broken-links" issue, keeps it updated, and closes it once every link answers again.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - portfolio/src/content/**
      - curriculum/cv_data.json
      - .github/workflows/links.yml

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn answers bots with 999 and wa.me redirects by design; both are checked by hand.
          # hechoensabaneta.com is down on the client's side (unpaid hosting), not a broken link on ours.
          # GitHub answers 503 to bots on /blob/ pages; the profile README links are published by publish-profile.yml.
          args: >-
            --no-progress
            --max-retries 2
            --timeout 20
            --accept 200..=299
            --exclude 'linkedin\.com'
            --exclude 'wa\.me'
            --exclude 'shields\.io'
            --exclude '^mailto:'
            --exclude 'hechoensabaneta\.com'
            --exclude 'github\.com/DevCat-HGS/DevCat-HGS/blob/'
            'portfolio/src/content/*.ts'
            'portfolio/src/content/data/*.json'
            'curriculum/cv_data.json'
            'README.md'
            'README.es.md'
          output: lychee/report.md
          fail: false

      # One issue at a time: updated while links stay broken, closed when they answer again.
      - name: Open, update or close the broken-links issue
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v9
        env:
          BROKEN: ${{ steps.lychee.outputs.exit_code != 0 }}
        with:
          script: |
            const fs = require("fs");
            const LABEL = "broken-links";
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const [open] = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: LABEL, per_page: 100,
            });
            if (process.env.BROKEN === "true") {
              const report = fs.readFileSync("lychee/report.md", "utf8");
              const body = `${report}\n\n<sub>Last checked by [this run](${run}).</sub>`;
              if (open) await github.rest.issues.update({ owner, repo, issue_number: open.number, body });
              else await github.rest.issues.create({ owner, repo, title: "Broken links found", body, labels: [LABEL, "maintenance"] });
            } else if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `Every link answers again ([run](${run})). Closing.` });
              await github.rest.issues.update({ owner, repo, issue_number: open.number, state: "closed", state_reason: "completed" });
            }

      - name: Fail the pull request check when links are broken
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'pull_request'
        run: |
          cat lychee/report.md
          exit 1
