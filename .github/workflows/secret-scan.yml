name: Secret scan

# GitHub's own secret scanning is not available for private repositories on the free plan, so gitleaks checks the
# whole history on every push and pull request: an API key, token or private key committed by mistake fails the
# check (with the value redacted in the log). A full scan takes a couple of seconds.
on:
  push:
    branches: [main, desarrollo]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Look for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the history with gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --no-banner --redact --verbose
